name: Keep Supabase awake

# Supabase pauses a Free-tier project after 7 days with no database activity.
# A paused store returns errors until someone restores it by hand from the
# dashboard, which is a bad way for a client to discover their preview link.
#
# This hits the storefront every third day. The homepage reads products from
# the database, so a single request is enough to reset the inactivity clock.
# It pings the public site rather than the database directly, so no Supabase
# key has to be stored here.
#
# Delete this workflow once the project moves to Supabase Pro — paid projects
# never pause, and the job stops being necessary.

on:
  schedule:
    # 03:00 UTC every third day. Well inside the 7-day window even if one run
    # is skipped or GitHub delays it.
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the storefront
        env:
          # Set this to the deployed URL: Settings -> Secrets and variables ->
          # Actions -> Variables -> New repository variable, named KEEPALIVE_URL.
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "KEEPALIVE_URL is not set — nothing to ping yet. Skipping."
            exit 0
          fi
          echo "Pinging $KEEPALIVE_URL"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$KEEPALIVE_URL")
          echo "HTTP $code"
          # A 401 still counts: the request reached the app and hit the database.
          # Only a transport failure or a 5xx means the ping did not land.
          case "$code" in
            2*|3*|401|403) echo "Project pinged."; exit 0 ;;
            *) echo "Ping did not land (HTTP $code)."; exit 1 ;;
          esac
