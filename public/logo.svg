<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 92" fill="none" role="img" aria-label="Mujeeb Perfumes">
  <!-- Brandbook 02: MUJEEB set solid, "P e r f u m e s" spaced beneath.
       Rendered as an image, so no webfont is available - the stack falls back
       to a geometric sans close to Alexandria. -->
  <text x="160" y="42" text-anchor="middle"
        font-family="Alexandria, 'Trebuchet MS', 'Segoe UI', Arial, sans-serif"
        font-size="38" font-weight="700" fill="#0d0d0d" letter-spacing="6">MUJEEB</text>
  <text x="160" y="70" text-anchor="middle"
        font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif"
        font-size="14" font-weight="400" fill="#5a5a5a" letter-spacing="9">PERFUMES</text>
</svg>
